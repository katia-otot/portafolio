<div class="fullpage-container">
  <nav
    class="portfolio-nav"
    [attr.aria-label]="'nav.aria' | t: i18n.locale()"
    [class.nav-open]="menuOpen"
  >
    <button
      type="button"
      class="nav-brand"
      (click)="goHome()"
      [attr.aria-label]="'nav.homeAria' | t: i18n.locale()"
    >
      <span class="nav-brand-mark" aria-hidden="true">
        <img
          class="nav-brand-cat theme-cat-dark"
          src="assets/cats/cat-walk.png"
          alt=""
          width="64"
          height="43"
        />
        <img
          class="nav-brand-cat theme-cat-light"
          src="assets/cats/cat-walk-light.png"
          alt=""
          width="64"
          height="43"
        />
      </span>
      <span class="nav-brand-name">Katia</span>
    </button>

    <div class="nav-right">
      <div
        class="lang-toggle"
        role="group"
        [attr.aria-label]="'nav.langAria' | t: i18n.locale()"
      >
        <button
          type="button"
          class="lang-btn"
          [class.lang-btn-active]="i18n.locale() === 'es'"
          (click)="setLocale('es')"
        >
          {{ 'nav.langEs' | t: i18n.locale() }}
        </button>
        <button
          type="button"
          class="lang-btn"
          [class.lang-btn-active]="i18n.locale() === 'en'"
          (click)="setLocale('en')"
        >
          {{ 'nav.langEn' | t: i18n.locale() }}
        </button>
      </div>

      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="
          themeService.theme() === 'dark'
            ? ('nav.themeToLight' | t: i18n.locale())
            : ('nav.themeToDark' | t: i18n.locale())
        "
      >
        @if (themeService.theme() === 'dark') {
          <i class="fas fa-sun" aria-hidden="true"></i>
        } @else {
          <i class="fas fa-moon" aria-hidden="true"></i>
        }
      </button>

      <button
        type="button"
        class="nav-burger"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen"
        aria-controls="nav-menu"
        [attr.aria-label]="
          menuOpen
            ? ('nav.closeMenu' | t: i18n.locale())
            : ('nav.openMenu' | t: i18n.locale())
        "
      >
        <span class="nav-burger-lines" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>

      <div
        id="nav-menu"
        class="nav-links"
        [class.nav-links-open]="menuOpen"
      >
        <button type="button" (click)="navigateTo('about')">
          {{ 'nav.about' | t: i18n.locale() }}
        </button>
        <button type="button" (click)="navigateTo('experience')">
          {{ 'nav.experience' | t: i18n.locale() }}
        </button>
        <button type="button" (click)="navigateTo('skills')">
          {{ 'nav.skills' | t: i18n.locale() }}
        </button>
        <button type="button" (click)="navigateTo('projects')">
          {{ 'nav.projects' | t: i18n.locale() }}
        </button>
        <button type="button" class="nav-cta" (click)="navigateTo('contact')">
          {{ 'nav.contact' | t: i18n.locale() }}
        </button>
      </div>
    </div>
  </nav>

  @if (menuOpen) {
    <button
      type="button"
      class="nav-backdrop"
      [attr.aria-label]="'nav.closeMenu' | t: i18n.locale()"
      (click)="closeMenu()"
    ></button>
  }

  <div class="ambient-bg" #ambientBg aria-hidden="true">
    <span class="glow glow-a"></span>
    <span class="glow glow-b"></span>
    <span class="glow glow-c"></span>
    <span class="glow glow-d"></span>
  </div>

  <section class="section hero-section" id="home">
    <div class="hero-grid">
      <div class="hero-copy">
        <p class="hero-eyebrow">{{ 'hero.eyebrow' | t: i18n.locale() }}</p>
        <h1 class="hero-headline">{{ 'hero.headline' | t: i18n.locale() }}</h1>
        <p class="hero-tagline">{{ 'hero.tagline' | t: i18n.locale() }}</p>
        <p class="hero-sub">{{ 'hero.sub' | t: i18n.locale() }}</p>
        <div class="hero-actions">
          <button
            type="button"
            class="btn btn-primary px-4 py-2 py-md-3"
            (click)="scrollToContact()"
          >
            {{ 'hero.cta' | t: i18n.locale() }}
          </button>
          <a
            class="btn btn-cv px-4 py-2 py-md-3"
            [href]="cvUrl()"
            [attr.download]="cvFilename()"
            target="_blank"
            rel="noopener noreferrer"
          >
            {{ 'hero.cv' | t: i18n.locale() }}
          </a>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <img
          class="hero-cat theme-cat-dark"
          src="assets/cats/cat-walk.png"
          alt=""
          width="1024"
          height="682"
        />
        <img
          class="hero-cat theme-cat-light"
          src="assets/cats/cat-walk-light.png"
          alt=""
          width="1024"
          height="682"
        />
      </div>
    </div>
  </section>

  <section class="section" id="about">
    <app-about></app-about>
  </section>

  <section class="section" id="experience">
    <app-experience></app-experience>
  </section>

  <section class="section" id="skills">
    <app-skills></app-skills>
  </section>

  <section class="section" id="projects">
    <app-projects></app-projects>
  </section>

  <section class="section" id="contact">
    <app-contact #contact></app-contact>
  </section>
</div>
