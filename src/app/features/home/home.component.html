<div class="fullpage-container">
  <nav class="portfolio-nav" aria-label="Secciones del portafolio">
    <button type="button" class="nav-brand" (click)="scrollToId('home')" aria-label="Inicio — Katia">
      <span class="nav-brand-mark" aria-hidden="true">
        <img
          class="nav-brand-cat theme-cat-dark"
          src="assets/cats/cat-walk.png"
          alt=""
          width="64"
          height="43"
        />
        <img
          class="nav-brand-cat theme-cat-light"
          src="assets/cats/cat-walk-light.png"
          alt=""
          width="64"
          height="43"
        />
      </span>
      <span class="nav-brand-name">Katia</span>
    </button>

    <div class="nav-right">
      <div class="nav-links">
        <button type="button" (click)="scrollToId('about')">Sobre mí</button>
        <button type="button" (click)="scrollToId('experience')">Experiencia</button>
        <button type="button" (click)="scrollToId('skills')">Habilidades</button>
        <button type="button" (click)="scrollToId('projects')">Proyectos</button>
        <button type="button" class="nav-cta" (click)="scrollToId('contact')">Contacto</button>
      </div>
      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      >
        @if (themeService.theme() === 'dark') {
          <i class="fas fa-sun" aria-hidden="true"></i>
        } @else {
          <i class="fas fa-moon" aria-hidden="true"></i>
        }
      </button>
    </div>
  </nav>

  <div class="ambient-bg" #ambientBg aria-hidden="true">
    <span class="glow glow-a"></span>
    <span class="glow glow-b"></span>
    <span class="glow glow-c"></span>
    <span class="glow glow-d"></span>
  </div>

  <section class="section hero-section" id="home">
    <div class="hero-grid">
      <div class="hero-copy">
        <p class="hero-eyebrow">Portafolio</p>
        <h1 class="hero-headline">Hola, soy Katia Gadea</h1>
        <p class="hero-tagline">Desarrolladora Full-Stack · Web &amp; Mobile</p>
        <p class="hero-sub">
          Productos claros, código mantenible y foco en la experiencia de usuario.
        </p>
        <button
          type="button"
          class="btn btn-primary px-4 py-2 py-md-3"
          (click)="scrollToContact()"
        >
          Contactame
        </button>
      </div>
      <div class="hero-art" aria-hidden="true">
        <img
          class="hero-cat theme-cat-dark"
          src="assets/cats/cat-walk.png"
          alt=""
          width="1024"
          height="682"
        />
        <img
          class="hero-cat theme-cat-light"
          src="assets/cats/cat-walk-light.png"
          alt=""
          width="1024"
          height="682"
        />
      </div>
    </div>
  </section>

  <section class="section" id="about">
    <app-about></app-about>
  </section>

  <section class="section" id="experience">
    <app-experience></app-experience>
  </section>

  <section class="section" id="skills">
    <app-skills></app-skills>
  </section>

  <section class="section" id="projects">
    <app-projects></app-projects>
  </section>

  <section class="section" id="contact">
    <app-contact #contact></app-contact>
  </section>
</div>
