<section class="contact-root">
  <div class="contact-inner">
    <header class="contact-header">
      <img
        class="contact-cat theme-cat-dark"
        src="assets/cats/cat-peek.png"
        alt=""
        aria-hidden="true"
        width="1024"
        height="682"
      />
      <img
        class="contact-cat theme-cat-light"
        src="assets/cats/cat-peek-light.png"
        alt=""
        aria-hidden="true"
        width="1024"
        height="682"
      />
      <span class="eyebrow">Contacto</span>
      <h2 class="contact-title">Ponte en contacto</h2>
      <app-wave-divider variant="narrow" />
    </header>

    <div class="contact-grid">
      <div class="contact-aside">
        <h3 class="contact-headline">
          Hablemos.<br />
          Estaré encantada de leerte.
        </h3>

        <dl class="contact-details">
          <div class="detail">
            <dt>Correo</dt>
            <dd>
              <a href="mailto:katiagadea19@gmail.com">katiagadea19&#64;gmail.com</a>
            </dd>
          </div>
          <div class="detail">
            <dt>Teléfono</dt>
            <dd>
              <a href="tel:+542262360846">02262360846</a>
            </dd>
          </div>
          <div class="detail">
            <dt>LinkedIn</dt>
            <dd>
              <a
                href="https://www.linkedin.com/in/katia-gadea-5a7ab2292/"
                target="_blank"
                rel="noopener noreferrer"
                >Katia Gadea</a
              >
            </dd>
          </div>
          <div class="detail">
            <dt>Disponibilidad</dt>
            <dd>Disponible para oportunidades en remoto o híbridas</dd>
          </div>
        </dl>
      </div>

      <form class="contact-form" (submit)="submitForm($event)">
        <div class="form-row">
          <label class="field">
            <span class="field-label">Nombre</span>
            <input
              type="text"
              name="name"
              [(ngModel)]="name"
              autocomplete="name"
              required
            />
          </label>
          <label class="field">
            <span class="field-label">Correo</span>
            <input
              type="email"
              name="email"
              [(ngModel)]="email"
              autocomplete="email"
              required
            />
          </label>
        </div>

        <label class="field field-full">
          <span class="field-label">Mensaje</span>
          <textarea
            name="message"
            rows="3"
            [(ngModel)]="message"
            required
          ></textarea>
        </label>

        <div class="form-footer">
          <p class="form-note">Te responderé lo antes posible.</p>
          <button type="submit" class="send-btn">Enviar →</button>
        </div>
      </form>
    </div>
  </div>
</section>
