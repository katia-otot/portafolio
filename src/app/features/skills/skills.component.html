<div class="skills-root">
  <div class="skills-inner">
    <header class="skills-header">
      <span class="eyebrow">{{ 'skills.eyebrow' | t: i18n.locale() }}</span>
      <h2 class="skills-title">{{ 'skills.title' | t: i18n.locale() }}</h2>
    </header>

    <div class="skills-groups">
      @for (group of groups(); track group.id) {
        <section class="skill-group" [attr.aria-labelledby]="'skills-' + group.id">
          <h3 class="group-title" [id]="'skills-' + group.id">{{ group.title }}</h3>
          <ul class="tech-grid" [attr.aria-label]="group.title">
            @for (tech of group.items; track tech.id) {
              <li class="tech-item">
                <span class="tech-symbol-wrap" aria-hidden="true">
                  <span class="tech-symbol" [style.--tech-url]="iconUrl(tech.slug)"></span>
                </span>
                <span class="tech-name">{{ tech.name }}</span>
              </li>
            }
          </ul>
        </section>
      }
    </div>
  </div>
</div>
