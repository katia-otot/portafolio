<div class="about-root">
  <div class="about-inner">
    <header class="about-header">
      <img
        class="about-cat theme-cat-dark"
        src="assets/cats/cat-sit.png"
        alt=""
        aria-hidden="true"
        width="682"
        height="1024"
      />
      <img
        class="about-cat theme-cat-light"
        src="assets/cats/cat-sit-light.png"
        alt=""
        aria-hidden="true"
        width="682"
        height="1024"
      />
      <span class="eyebrow">{{ 'about.eyebrow' | t: i18n.locale() }}</span>
      <h2 class="about-title">{{ 'about.title' | t: i18n.locale() }}</h2>
      <app-wave-divider variant="narrow" />
    </header>

    <div class="about-content">
      <p class="about-text">{{ 'about.p1' | t: i18n.locale() }}</p>
      <p class="about-text">{{ 'about.p2' | t: i18n.locale() }}</p>
      <p class="about-text">{{ 'about.p3' | t: i18n.locale() }}</p>
    </div>
  </div>
</div>
